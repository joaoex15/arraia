<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arraiá de Lançamentos Stanza</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #23252f;
      --bg2:          #1a1c24;
      --orange:       #ff6a00;
      --orange-dim:   rgba(255,106,0,0.18);
      --orange-glow:  rgba(255,106,0,0.45);
      --purple:       #4b2d8a;
      --white:        #ffffff;
      --muted:        rgba(255,255,255,0.35);
      --bar-empty:    rgba(255,106,0,0.1);
      --font-display: 'Bebas Neue', cursive;
      --font-body:    'Nunito', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-body);
      color: var(--white);
    }

    .stage {
      position: relative; z-index: 1;
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr 300px;
      grid-template-areas:
        "header  header"
        "fire    sidebar"
        "bar     bar";
      padding: 28px 36px 22px;
    }

    /* ===== HEADER ===== */
    .header {
      grid-area: header;
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,106,0,0.2);
      margin-bottom: 14px;
    }

    .header-brand {
      display: flex;
      align-items: center;
    }

    .stanza-logo {
      height: clamp(80px, 12vh, 130px);
      width: auto;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 10px rgba(255,106,0,0.4));
      transition: all 0.3s ease;
    }
    .stanza-logo:hover {
      filter: drop-shadow(0 0 18px rgba(255,106,0,0.8));
      transform: scale(1.04);
    }

    .header-count {
      text-align: right;
    }
    .count-num {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 4.5vw, 3.8rem);
      line-height: 1;
      color: var(--orange);
    }
    .count-label {
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ===== ÁREA DA FOGUEIRA ===== */
    .fire-area {
      grid-area: fire;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .bonfire-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transition: transform 0.7s cubic-bezier(.34,1.56,.64,1);
      transform-origin: bottom center;
    }

    .logs { width: 160px; height: 36px; position: relative; z-index: 2; }
    .log {
      position: absolute;
      height: 18px; border-radius: 9px;
      background: linear-gradient(180deg, #6b3a1f, #2e1508);
      box-shadow: inset 0 -4px 8px rgba(0,0,0,.6);
    }
    .log-1 { width: 130px; bottom: 0; left: 15px; transform: rotate(-8deg); }
    .log-2 { width: 140px; bottom: 8px; left: 10px; transform: rotate(6deg); }
    .log-3 { width: 80px;  bottom: 14px; left: 40px; transform: rotate(-2deg); }

    .flames {
      position: relative;
      width: 140px; height: 200px;
      margin-bottom: -4px;
      transition: transform 0.6s ease, filter 0.6s ease;
    }
    .flame {
      position: absolute; bottom: 0;
      border-radius: 50% 50% 30% 30% / 80% 80% 20% 20%;
      animation: flicker var(--dur, 2s) ease-in-out infinite alternate;
      transform-origin: bottom center;
    }
    .flame-1 { width: 90px; height: 160px; left: 25px; background: radial-gradient(ellipse at 50% 80%, #ffe0b2, #ff6a00 50%, #cc3300 100%); --dur: 1.8s; opacity: 0.95; }
    .flame-2 { width: 60px; height: 130px; left: 40px; background: radial-gradient(ellipse at 50% 80%, #fff3e0, #ffb347 40%, #ff6a00 100%); --dur: 1.4s; animation-delay: -0.3s; opacity: 0.9; }
    .flame-3 { width: 40px; height: 90px; left: 52px; background: radial-gradient(ellipse at 50% 80%, #ffffff, #ffe0b2 50%, #ffb347 100%); --dur: 1.1s; animation-delay: -0.6s; opacity: 0.85; }
    .flame-4 { width: 50px; height: 100px; left: 10px; background: radial-gradient(ellipse at 50% 80%, #ffb347, #ff6a00 60%, #cc3300 100%); --dur: 2.1s; animation-delay: -0.9s; opacity: 0.7; }
    .flame-5 { width: 50px; height: 110px; right: 10px; background: radial-gradient(ellipse at 50% 80%, #ffb347, #ff6a00 60%, #cc3300 100%); --dur: 1.7s; animation-delay: -0.2s; opacity: 0.7; }

    @keyframes flicker {
      0%   { transform: scaleX(1)    scaleY(1)    skewX(0deg);  }
      33%  { transform: scaleX(1.04) scaleY(0.97) skewX(2deg);  }
      66%  { transform: scaleX(0.96) scaleY(1.03) skewX(-2deg); }
      100% { transform: scaleX(1.02) scaleY(0.98) skewX(1deg);  }
    }

    .sparks { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 100px; height: 200px; pointer-events: none; }
    .spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #ff6a00; opacity: 0; animation: rise var(--rd, 2s) ease-in infinite; animation-delay: var(--dl, 0s); left: var(--lx, 50%); }
    @keyframes rise {
      0%   { transform: translateY(0)      scale(1);   opacity: 0.9; }
      80%  { transform: translateY(-180px) scale(0.4); opacity: 0.4; }
      100% { transform: translateY(-220px) scale(0);   opacity: 0;   }
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      grid-area: sidebar;
      display: flex; flex-direction: column;
      justify-content: center; gap: 20px;
      padding-left: 28px;
      border-left: 1px solid rgba(255,106,0,0.15);
    }

    .status-card { background: rgba(255,106,0,0.07); border: 1px solid rgba(255,106,0,0.2); border-radius: 14px; padding: 18px; }
    .status-label { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .status-text { font-family: var(--font-display); font-size: clamp(1.3rem, 2vw, 1.9rem); line-height: 1.1; color: var(--orange); transition: color 0.5s ease; }

    .percent-card { text-align: center; }
    .percent-num { font-family: var(--font-display); font-size: clamp(4rem, 6.5vw, 5.5rem); line-height: 1; color: var(--orange); transition: color 0.4s ease; }
    .percent-sym { font-size: 0.4em; vertical-align: super; opacity: 0.7; }

    .bunting { display: flex; align-items: center; justify-content: center; gap: 6px; opacity: 0.5; }
    .flag { width: 18px; height: 22px; clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%); }
    .flag-1 { background: var(--purple); }
    .flag-2 { background: var(--orange); }
    .flag-3 { background: var(--purple); }
    .flag-4 { background: var(--orange); }
    .flag-5 { background: var(--purple); }
    .bunting-line { flex: 1; max-width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--muted), transparent); }

    /* ===== BARRA DE PROGRESSO ===== */
    .bar-area { grid-area: bar; padding-top: 14px; }
    .bar-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .bar-title { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
    .bar-track { width: 100%; height: 24px; background: var(--bar-empty); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,106,0,0.15); }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #cc3300, #ff6a00, #ffb347); border-radius: 12px; transition: width 0.5s cubic-bezier(.4,0,.2,1); box-shadow: 0 0 18px rgba(255,106,0,0.5); position: relative; }
    .bar-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2) 50%, transparent); animation: shimmer 2.2s linear infinite; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
    .bar-milestones { position: relative; height: 14px; margin-top: 5px; }
    .milestone { position: absolute; transform: translateX(-50%); font-size: 0.55rem; color: var(--muted); letter-spacing: 1px; }

    /* ===== OVERLAY DE LANÇAMENTO ===== */
    .launch-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; opacity: 0;
      background: var(--bg);
      transition: opacity 0.6s ease;
    }
    .launch-overlay.active { pointer-events: all; opacity: 1; }

    .launch-fire-wrap {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      margin-bottom: 40px;
      animation: launchScale 0.8s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes launchScale { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* LOGO NO LAUNCH: destaque total — acima da fogueira, grande, pulsante */
  
    @keyframes logoEntrance {
      0%   { opacity: 0; transform: scale(0.5) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes logoPulse {
      0%   { filter: drop-shadow(0 0 20px rgba(255,106,0,0.9)) drop-shadow(0 0 40px rgba(255,106,0,0.4)); }
      100% { filter: drop-shadow(0 0 50px rgba(255,180,50,1))  drop-shadow(0 0 100px rgba(255,106,0,0.7)); }
    }

    .launch-flames { width: 360px; height: 500px; position: relative; }
    .launch-flame { position: absolute; bottom: 0; border-radius: 50% 50% 30% 30% / 80% 80% 20% 20%; animation: flicker var(--dur, 2s) ease-in-out infinite alternate; transform-origin: bottom center; }
    .lf-1 { width: 240px; height: 440px; left: 60px; background: radial-gradient(ellipse at 50% 80%, #ffe0b2, #ff6a00 50%, #cc2200 100%); --dur:1.8s; }
    .lf-2 { width: 160px; height: 360px; left: 100px; background: radial-gradient(ellipse at 50% 80%, #fff3e0, #ffb347 40%, #ff6a00 100%); --dur:1.4s; animation-delay:-0.3s; }
    .lf-3 { width: 100px; height: 260px; left: 130px; background: radial-gradient(ellipse at 50% 80%, #ffffff, #ffe0b2 40%, #ffb347 100%); --dur:1.1s; animation-delay:-0.6s; }
    .lf-4 { width: 130px; height: 300px; left: 20px;  background: radial-gradient(ellipse at 50% 80%, #ffb347, #ff6a00 60%, #cc2200 100%); --dur:2.1s; animation-delay:-0.9s; opacity:0.8; }
    .lf-5 { width: 130px; height: 320px; right: 20px; background: radial-gradient(ellipse at 50% 80%, #ffb347, #ff6a00 60%, #cc2200 100%); --dur:1.7s; animation-delay:-0.2s; opacity:0.8; }
    .launch-logs { width: 340px; height: 48px; position: relative; z-index: 2; }
    .launch-log { position: absolute; height: 24px; border-radius: 12px; background: linear-gradient(180deg, #6b3a1f, #2e1508); }
    .ll-1 { width: 280px; bottom: 0; left: 30px; transform: rotate(-6deg); }
    .ll-2 { width: 300px; bottom: 12px; left: 20px; transform: rotate(5deg); }

    .launch-glow { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(255,106,0,0.25) 0%, transparent 70%); bottom: 0; left: 50%; transform: translateX(-50%); animation: glowPulse 1.2s ease-in-out infinite alternate; z-index: -1; }
    @keyframes glowPulse { 0% { transform: translateX(-50%) scale(1); opacity: 0.6; } 100% { transform: translateX(-50%) scale(1.3); opacity: 1; } }

    .launch-texts { text-align: center; animation: textFadeIn 0.6s 0.4s ease both; }
    @keyframes textFadeIn { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
    .launch-title { font-family: var(--font-display); font-size: clamp(5rem, 11vw, 10rem); line-height: 0.9; color: var(--orange); letter-spacing: 4px; text-shadow: 0 0 40px rgba(255,106,0,0.8), 0 0 80px rgba(255,106,0,0.4); }
    .launch-sub { font-family: var(--font-display); font-size: clamp(2rem, 4vw, 3.5rem); letter-spacing: 8px; color: var(--white); opacity: 0.85; margin-top: 8px; }

    .launch-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .launch-sparks { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 200px; height: 400px; pointer-events: none; }
  /* LOGO NO LAUNCH: destaque total — acima da fogueira, grande, pulsante */
    .launch-logo-fire {
      display: block;
      width: clamp(320px, 40vw, 520px);
            
      filter: drop-shadow(0 0 30px rgba(255,106,0,1)) drop-shadow(0 0 60px rgba(255,160,50,0.7));
      animation: logoPulse 1.4s ease-in-out infinite alternate, logoEntrance 0.7s 0.2s cubic-bezier(.34,1.56,.64,1) both;
      
      /* NOVO ALINHAMENTO */
      position: absolute;
      left: 50%;
      top: 50%; /* Se quiser a logo mais pra cima ou pra baixo, é só ajustar essa porcentagem (ex: 40%) */
      z-index: 10;
    }
    
    /* A ANIMAÇÃO PRECISA ACOMPANHAR O ALINHAMENTO CENTRAL */
    @keyframes logoEntrance {
      0%   { opacity: 0; transform: translate(-50%, 40px) scale(0.5); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>

<!-- OVERLAY DE LANÇAMENTO -->
<div class="launch-overlay" id="launchOverlay">
  <div class="launch-confetti" id="confettiContainer"></div>

  <!-- LOGO em destaque, acima de tudo -->

  <div class="launch-fire-wrap">
  <div class="launch-glow"></div>
  <div class="launch-sparks" id="launchSparks"></div>

  <div class="launch-flames">

    <img
      class="launch-logo-fire"
      id="launchLogoFire"
      src="logo.png"
      alt="Stanza"
    />

    <div class="launch-flame lf-4"></div>
    <div class="launch-flame lf-5"></div>
    <div class="launch-flame lf-1"></div>
    <div class="launch-flame lf-2"></div>
    <div class="launch-flame lf-3"></div>

  </div>

  <div class="launch-logs">
    <div class="launch-log ll-1"></div>
    <div class="launch-log ll-2"></div>
  </div>
</div>

  <div class="launch-texts">
    <div class="launch-title">LANCAMENTOS</div>
    <div class="launch-sub">LIBERADOS</div>
  </div>
</div>

<!-- LAYOUT NORMAL -->
<div class="stage">

  <header class="header">
    <div class="header-brand">
      <img src="logo.png" alt="Stanza" class="stanza-logo" />
    </div>
    <div class="header-count">
      <div class="count-num" id="totalClicks">0</div>
      <div class="count-label">Lenhas jogadas</div>
    </div>
  </header>

  <div class="fire-area">
    <div class="bonfire-wrap" id="bonfireWrap">
      <div class="sparks" id="sparksContainer"></div>
      <div class="flames" id="flames">
        <div class="flame flame-4"></div>
        <div class="flame flame-5"></div>
        <div class="flame flame-1"></div>
        <div class="flame flame-2"></div>
        <div class="flame flame-3"></div>
      </div>
      <div class="logs">
        <div class="log log-1"></div>
        <div class="log log-2"></div>
        <div class="log log-3"></div>
      </div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="bunting">
      <div class="bunting-line"></div>
      <div class="flag flag-1"></div>
      <div class="flag flag-2"></div>
      <div class="flag flag-3"></div>
      <div class="flag flag-4"></div>
      <div class="flag flag-5"></div>
      <div class="bunting-line"></div>
    </div>

    <div class="percent-card">
      <div class="percent-num" id="percentNum">0<span class="percent-sym">%</span></div>
    </div>

    <div class="status-card">
      <div class="status-label">Status atual</div>
      <div class="status-text" id="statusText">Preparando a fogueira...</div>
    </div>

    <div class="bunting">
      <div class="bunting-line"></div>
      <div class="flag flag-2"></div>
      <div class="flag flag-1"></div>
      <div class="flag flag-2"></div>
      <div class="flag flag-1"></div>
      <div class="flag flag-2"></div>
      <div class="bunting-line"></div>
    </div>
  </aside>

  <div class="bar-area">
    <div class="bar-header">
      <span class="bar-title">Termometro da Energia</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <div class="bar-milestones">
      <span class="milestone" style="left:0%">0%</span>
      <span class="milestone" style="left:25%">25%</span>
      <span class="milestone" style="left:50%">50%</span>
      <span class="milestone" style="left:75%">75%</span>
      <span class="milestone" style="left:100%">100%</span>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket       = io();
const barFill      = document.getElementById('barFill');
const percentNum   = document.getElementById('percentNum');
const statusText   = document.getElementById('statusText');
const totalClicks  = document.getElementById('totalClicks');
const bonfireWrap  = document.getElementById('bonfireWrap');
const flames       = document.getElementById('flames');
const launchOverlay= document.getElementById('launchOverlay');

const STATUS_MAP = [
  { min: 0,  max: 24,  text: 'Preparando a fogueira...' },
  { min: 25, max: 49,  text: 'Aquecendo os motores'      },
  { min: 50, max: 74,  text: 'O mercado esta esquentando'},
  { min: 75, max: 99,  text: 'Expectativa la em cima'    },
  { min: 100,max: 100, text: 'LANCAMENTOS LIBERADOS'     },
];
function getStatus(p) { return STATUS_MAP.find(s => p >= s.min && p <= s.max) || STATUS_MAP[0]; }

let launchTriggered = false;

function updateUI(percent, energy) {
  barFill.style.width = percent + '%';
  percentNum.innerHTML = `${percent}<span class="percent-sym">%</span>`;
  totalClicks.textContent = energy.toLocaleString('pt-BR');

  const s = getStatus(percent);
  statusText.textContent = s.text;

  const scaleVal = 0.45 + (percent / 100) * 1.75;
  bonfireWrap.style.transform = `scale(${scaleVal})`;

  const glow = Math.round((percent / 100) * 70);
  const glowOpacity = 0.15 + (percent / 100) * 0.7;
  flames.style.filter = `drop-shadow(0 0 ${glow}px rgba(255,106,0,${glowOpacity}))`;

  if (percent >= 100 && !launchTriggered) {
    launchTriggered = true;
    triggerLaunch();
  } else if (percent < 100 && launchTriggered) {
    launchTriggered = false;
    launchOverlay.classList.remove('active');
  }
}

function triggerLaunch() {
  launchOverlay.classList.add('active');
  spawnConfetti();
  spawnLaunchSparks();
}

function spawnConfetti() {
  const c = document.getElementById('confettiContainer');
  c.innerHTML = '';
  const cols = ['#ff6a00','#ffb347','#4b2d8a','#ffffff','#cc3300','#ffe0b2'];
  for (let i = 0; i < 100; i++) {
    const el = document.createElement('div');
    el.style.cssText = `
      position:absolute;
      width:${5 + Math.random()*8}px; height:${5 + Math.random()*8}px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      left:${Math.random()*100}%; top:-20px;
      animation:confettiFall ${2+Math.random()*3}s ease-in ${Math.random()*2}s infinite;
    `;
    c.appendChild(el);
  }
  if (!document.getElementById('cStyle')) {
    const st = document.createElement('style');
    st.id = 'cStyle';
    st.textContent = `@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.2}}`;
    document.head.appendChild(st);
  }
}

function spawnLaunchSparks() {
  const c = document.getElementById('launchSparks');
  c.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.cssText = `--lx:${5+Math.random()*90}%;--rd:${1+Math.random()*2}s;--dl:${-(Math.random()*2)}s;background:#ff6a00;`;
    c.appendChild(s);
  }
}

socket.on('energy_update', ({ energy, percent }) => updateUI(percent, energy));

(function() {
  const c = document.getElementById('sparksContainer');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.cssText = `--lx:${10+Math.random()*80}%;--rd:${1.5+Math.random()*1.5}s;--dl:${-(Math.random()*2)}s;`;
    c.appendChild(s);
  }
})();
</script>
</body>
</html>
