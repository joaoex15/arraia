<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arraiá de Lançamentos Stanza</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #23252f;
      --orange:       #ff6a00;
      --purple:       #4b2d8a;
      --white:        #ffffff;
      --muted:        rgba(255,255,255,0.35);
      --bar-empty:    rgba(255,106,0,0.1);
      --font-display: 'Bebas Neue', cursive;
      --font-body:    'Nunito', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-body);
      color: var(--white);
    }

    /* ===================================================
       TELA NORMAL
    =================================================== */
    .stage {
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr 280px;
      grid-template-areas:
        "header  header"
        "fire    sidebar"
        "bar     bar";
      padding: 20px 28px 16px;
    }

    /* HEADER */
    .header {
      grid-area: header;
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,106,0,0.2);
      margin-bottom: 10px;
    }
    .stanza-logo {
      height: clamp(44px, 8vh, 90px);
      width: auto;
      filter: drop-shadow(0 0 8px rgba(255,106,0,0.3));
    }
    .count-num  { font-family:var(--font-display); font-size:clamp(2rem,4vw,3.5rem); line-height:1; color:var(--orange); text-align:right; }
    .count-label{ font-size:.6rem; letter-spacing:2px; color:var(--muted); text-transform:uppercase; text-align:right; }

    /* FOGUEIRA */
    .fire-area {
      grid-area: fire;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .bonfire-wrap {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      transition: transform 0.7s cubic-bezier(.34,1.56,.64,1);
      transform-origin: bottom center;
    }
    .logs { width:160px; height:36px; position:relative; z-index:2; }
    .log  { position:absolute; height:18px; border-radius:9px; background:linear-gradient(180deg,#6b3a1f,#2e1508); box-shadow:inset 0 -4px 8px rgba(0,0,0,.6); }
    .log-1{ width:130px; bottom:0;   left:15px; transform:rotate(-8deg); }
    .log-2{ width:140px; bottom:8px; left:10px; transform:rotate(6deg); }
    .log-3{ width:80px;  bottom:14px;left:40px; transform:rotate(-2deg); }
    .flames{ position:relative; width:140px; height:200px; margin-bottom:-4px; transition:filter .6s ease; }
    .flame { position:absolute; bottom:0; border-radius:50% 50% 30% 30%/80% 80% 20% 20%; animation:flicker var(--dur,2s) ease-in-out infinite alternate; transform-origin:bottom center; }
    .flame-1{ width:90px;  height:160px; left:25px;  background:radial-gradient(ellipse at 50% 80%,#ffe0b2,#ff6a00 50%,#cc3300 100%); --dur:1.8s; opacity:.95; }
    .flame-2{ width:60px;  height:130px; left:40px;  background:radial-gradient(ellipse at 50% 80%,#fff3e0,#ffb347 40%,#ff6a00 100%); --dur:1.4s; animation-delay:-.3s; opacity:.9; }
    .flame-3{ width:40px;  height:90px;  left:52px;  background:radial-gradient(ellipse at 50% 80%,#ffffff,#ffe0b2 50%,#ffb347 100%); --dur:1.1s; animation-delay:-.6s; opacity:.85; }
    .flame-4{ width:50px;  height:100px; left:10px;  background:radial-gradient(ellipse at 50% 80%,#ffb347,#ff6a00 60%,#cc3300 100%); --dur:2.1s; animation-delay:-.9s; opacity:.7; }
    .flame-5{ width:50px;  height:110px; right:10px; background:radial-gradient(ellipse at 50% 80%,#ffb347,#ff6a00 60%,#cc3300 100%); --dur:1.7s; animation-delay:-.2s; opacity:.7; }
    @keyframes flicker {
      0%  { transform:scaleX(1)    scaleY(1)   skewX(0);    }
      33% { transform:scaleX(1.04) scaleY(.97) skewX(2deg); }
      66% { transform:scaleX(.96)  scaleY(1.03)skewX(-2deg);}
      100%{ transform:scaleX(1.02) scaleY(.98) skewX(1deg); }
    }
    .sparks{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%); width:100px; height:200px; pointer-events:none; }
    .spark { position:absolute; width:4px; height:4px; border-radius:50%; background:#ff6a00; opacity:0; animation:rise var(--rd,2s) ease-in infinite; animation-delay:var(--dl,0s); left:var(--lx,50%); }
    @keyframes rise{ 0%{transform:translateY(0) scale(1);opacity:.9} 80%{transform:translateY(-180px) scale(.4);opacity:.4} 100%{transform:translateY(-220px) scale(0);opacity:0} }

    /* SIDEBAR */
    .sidebar{ grid-area:sidebar; display:flex; flex-direction:column; justify-content:center; gap:14px; padding-left:22px; border-left:1px solid rgba(255,106,0,0.15); }
    .status-card{ background:rgba(255,106,0,0.07); border:1px solid rgba(255,106,0,0.2); border-radius:14px; padding:14px; }
    .status-label{ font-size:.55rem; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .status-text{ font-family:var(--font-display); font-size:clamp(1rem,1.7vw,1.7rem); line-height:1.1; color:var(--orange); transition:color .5s; }
    .percent-card{ text-align:center; }
    .percent-num{ font-family:var(--font-display); font-size:clamp(3rem,5.5vw,5rem); line-height:1; color:var(--orange); }
    .percent-sym{ font-size:.4em; vertical-align:super; opacity:.7; }
    .bunting{ display:flex; align-items:center; justify-content:center; gap:5px; opacity:.4; }
    .flag{ width:15px; height:19px; clip-path:polygon(0 0,100% 0,100% 75%,50% 100%,0 75%); }
    .flag-1,.flag-3,.flag-5{ background:var(--purple); }
    .flag-2,.flag-4{ background:var(--orange); }
    .bunting-line{ flex:1; max-width:44px; height:1px; background:linear-gradient(90deg,transparent,var(--muted),transparent); }

    /* BARRA */
    .bar-area{ grid-area:bar; padding-top:10px; }
    .bar-title{ font-size:.55rem; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block; }
    .bar-track{ width:100%; height:20px; background:var(--bar-empty); border-radius:10px; overflow:hidden; border:1px solid rgba(255,106,0,0.15); }
    .bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#cc3300,#ff6a00,#ffb347); border-radius:10px; transition:width .5s cubic-bezier(.4,0,.2,1); box-shadow:0 0 16px rgba(255,106,0,.5); position:relative; }
    .bar-fill::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.2) 50%,transparent); animation:shimmer 2.2s linear infinite; }
    @keyframes shimmer{ 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
    .bar-milestones{ position:relative; height:14px; margin-top:4px; }
    .milestone{ position:absolute; transform:translateX(-50%); font-size:.5rem; color:var(--muted); }

    /* ===================================================
       OVERLAY DE LANÇAMENTO — EXATAMENTE como a imagem:
       [LANÇAMENTOS]   [FOGUEIRA GRANDE]   [LIBERADOS]
    =================================================== */
    .launch-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      pointer-events: none; opacity: 0;
      background: var(--bg);
      transition: opacity .5s ease;
    }
    .launch-overlay.active { pointer-events: all; opacity: 1; }

    /* Topo: logo Stanza + contador (mesmo visual do header normal) */
    .launch-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 36px 14px;
      border-bottom: 1px solid rgba(255,106,0,0.2);
      flex-shrink: 0;
    }
    .launch-header-logo {
      height: clamp(44px, 7vh, 80px); width: auto;
      filter: drop-shadow(0 0 8px rgba(255,106,0,0.4));
    }
    .launch-header-count { text-align:right; }
    .launch-header-count .n { font-family:var(--font-display); font-size:clamp(2rem,3.5vw,3rem); line-height:1; color:var(--orange); }
    .launch-header-count .l { font-size:.6rem; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }

    /* Corpo central: 3 colunas */
    .launch-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 5vw 2vh;
      gap: 2vw;
    }

    /* Textos laterais */
    .launch-word {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 7rem);
      line-height: 1;
      white-space: nowrap;       /* nunca quebra */
      color: var(--orange);
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(255,106,0,.7), 0 0 60px rgba(255,106,0,.3);
      animation: wordPop .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    .launch-word-left  { text-align: right;  animation-delay: 0s;   }
    .launch-word-right { text-align: left;   animation-delay: .15s; }
    @keyframes wordPop { 0%{opacity:0;transform:scale(.5)} 100%{opacity:1;transform:scale(1)} }

    /* Fogueira central grande */
    .launch-fire-center {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      animation: fireRise .8s .05s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes fireRise { 0%{opacity:0;transform:scale(.4) translateY(60px)} 100%{opacity:1;transform:scale(1) translateY(0)} }

    .launch-glow {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: clamp(280px,35vw,500px); height: clamp(280px,35vw,500px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,106,0,.22) 0%, transparent 70%);
      animation: glowPulse 1.2s ease-in-out infinite alternate;
      z-index: -1;
    }
    @keyframes glowPulse{ 0%{transform:translateX(-50%) scale(1);opacity:.6} 100%{transform:translateX(-50%) scale(1.4);opacity:1} }

    .launch-sparks{ position:absolute; bottom:50px; left:50%; transform:translateX(-50%); width:180px; height:60vh; pointer-events:none; }

    /* Chamas grandes — tamanho relativo à viewport */
    .launch-flames {
      width:  clamp(160px, 22vw, 320px);
      height: clamp(365px, 40vh, 680px);
      position: relative;
    }
    .lf { position:absolute; bottom:0; border-radius:50% 50% 30% 30%/80% 80% 20% 20%; animation:flicker var(--dur,2s) ease-in-out infinite alternate; transform-origin:bottom center; }
    .lf-1{ width:67%; height:88%; left:17%; background:radial-gradient(ellipse at 50% 80%,#ffe0b2,#ff6a00 50%,#cc2200 100%); --dur:1.8s; }
    .lf-2{ width:45%; height:72%; left:28%; background:radial-gradient(ellipse at 50% 80%,#fff3e0,#ffb347 40%,#ff6a00 100%); --dur:1.4s; animation-delay:-.3s; }
    .lf-3{ width:28%; height:52%; left:36%; background:radial-gradient(ellipse at 50% 80%,#ffffff,#ffe0b2 40%,#ffb347 100%); --dur:1.1s; animation-delay:-.6s; }
    .lf-4{ width:36%; height:60%; left:5%;  background:radial-gradient(ellipse at 50% 80%,#ffb347,#ff6a00 60%,#cc2200 100%); --dur:2.1s; animation-delay:-.9s; opacity:.8; }
    .lf-5{ width:36%; height:64%; right:5%; background:radial-gradient(ellipse at 50% 80%,#ffb347,#ff6a00 60%,#cc2200 100%); --dur:1.7s; animation-delay:-.2s; opacity:.8; }

    .launch-logs { width:clamp(140px,18vw,260px); height:40px; position:relative; z-index:2; }
    .ll { position:absolute; height:20px; border-radius:10px; background:linear-gradient(180deg,#6b3a1f,#2e1508); }
    .ll-1{ width:83%; bottom:0;   left:8%;  transform:rotate(-6deg); }
    .ll-2{ width:90%; bottom:10px;left:5%;  transform:rotate(5deg); }

    /* Confetti */
    .launch-confetti{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }

    /* ===== PORTRAIT: fogueira em cima, textos embaixo ===== */
    @media (orientation: portrait) {
      .launch-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2vh;
        padding: 0 6vw 4vh;
      }
      .launch-fire-center { order: 1; }
      .launch-word-left   { order: 2; text-align: center; font-size: clamp(2.8rem, 11vw, 5rem); }
      .launch-word-right  { order: 3; text-align: center; font-size: clamp(2.8rem, 11vw, 5rem); }
      .launch-flames {
        width:  clamp(160px, 58vw, 300px);
        height: clamp(240px, 40vh, 400px);
      }
      .launch-logs { width: clamp(140px, 50vw, 240px); }
    }
  </style>
</head>
<body>

<!-- ===== OVERLAY LANÇAMENTO ===== -->
<div class="launch-overlay" id="launchOverlay">
  <div class="launch-confetti" id="confettiContainer"></div>

  <!-- Header igual ao normal: logo + contagem -->
  <div class="launch-header">
    <img class="launch-header-logo" src="logo.png" alt="Stanza" onerror="this.style.display='none'" />
    <div class="launch-header-count">
      <div class="n" id="launchClicks">0</div>
      <div class="l">Lenhas jogadas</div>
    </div>
  </div>

  <!-- Corpo: LANÇAMENTOS | Fogueira | LIBERADOS -->
  <div class="launch-body">

    <div class="launch-word launch-word-left">LANÇAMENTOS</div>

    <div class="launch-fire-center">
      <div class="launch-glow"></div>
      <div class="launch-sparks" id="launchSparks"></div>
      <div class="launch-flames">
        <div class="lf lf-4"></div>
        <div class="lf lf-5"></div>
        <div class="lf lf-1"></div>
        <div class="lf lf-2"></div>
        <div class="lf lf-3"></div>
      </div>
      <div class="launch-logs">
        <div class="ll ll-1"></div>
        <div class="ll ll-2"></div>
      </div>
    </div>

    <div class="launch-word launch-word-right">LIBERADOS</div>

  </div>
</div>

<!-- ===== TELA NORMAL ===== -->
<div class="stage">

  <header class="header">
    <img src="logo.png" alt="Stanza" class="stanza-logo" onerror="this.style.display='none'" />
    <div>
      <div class="count-num" id="totalClicks">0</div>
      <div class="count-label">Lenhas jogadas</div>
    </div>
  </header>

  <div class="fire-area">
    <div class="bonfire-wrap" id="bonfireWrap">
      <div class="sparks" id="sparksContainer"></div>
      <div class="flames" id="flames">
        <div class="flame flame-4"></div>
        <div class="flame flame-5"></div>
        <div class="flame flame-1"></div>
        <div class="flame flame-2"></div>
        <div class="flame flame-3"></div>
      </div>
      <div class="logs">
        <div class="log log-1"></div>
        <div class="log log-2"></div>
        <div class="log log-3"></div>
      </div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="bunting">
      <div class="bunting-line"></div>
      <div class="flag flag-1"></div><div class="flag flag-2"></div>
      <div class="flag flag-3"></div><div class="flag flag-4"></div>
      <div class="flag flag-5"></div>
      <div class="bunting-line"></div>
    </div>
    <div class="percent-card">
      <div class="percent-num" id="percentNum">0<span class="percent-sym">%</span></div>
    </div>
    <div class="status-card">
      <div class="status-label">Status atual</div>
      <div class="status-text" id="statusText">Preparando a fogueira...</div>
    </div>
    <div class="bunting">
      <div class="bunting-line"></div>
      <div class="flag flag-2"></div><div class="flag flag-1"></div>
      <div class="flag flag-2"></div><div class="flag flag-1"></div>
      <div class="flag flag-2"></div>
      <div class="bunting-line"></div>
    </div>
  </aside>

  <div class="bar-area">
    <span class="bar-title">Termômetro da Energia</span>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-milestones">
      <span class="milestone" style="left:0%">0%</span>
      <span class="milestone" style="left:25%">25%</span>
      <span class="milestone" style="left:50%">50%</span>
      <span class="milestone" style="left:75%">75%</span>
      <span class="milestone" style="left:100%">100%</span>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket        = io();
const barFill       = document.getElementById('barFill');
const percentNum    = document.getElementById('percentNum');
const statusText    = document.getElementById('statusText');
const totalClicks   = document.getElementById('totalClicks');
const launchClicks  = document.getElementById('launchClicks');
const bonfireWrap   = document.getElementById('bonfireWrap');
const flames        = document.getElementById('flames');
const launchOverlay = document.getElementById('launchOverlay');

const STATUS_MAP = [
  { min:0,  max:24,  text:'Preparando a fogueira...' },
  { min:25, max:49,  text:'Aquecendo os motores'      },
  { min:50, max:74,  text:'O mercado está esquentando'},
  { min:75, max:99,  text:'Expectativa lá em cima'    },
  { min:100,max:100, text:'LANÇAMENTOS LIBERADOS'     },
];
function getStatus(p){ return STATUS_MAP.find(s=>p>=s.min&&p<=s.max)||STATUS_MAP[0]; }

let launchTriggered = false;

function updateUI(percent, energy) {
  // Tela normal
  barFill.style.width = percent + '%';
  percentNum.innerHTML = `${percent}<span class="percent-sym">%</span>`;
  const formatted = energy.toLocaleString('pt-BR');
  totalClicks.textContent = formatted;
  launchClicks.textContent = formatted;
  statusText.textContent = getStatus(percent).text;

  // Fogueira cresce de 0.45x a 2.2x
  bonfireWrap.style.transform = `scale(${0.45 + (percent/100)*1.75})`;
  flames.style.filter = `drop-shadow(0 0 ${Math.round(percent*.7)}px rgba(255,106,0,${.15+(percent/100)*.7}))`;

  if (percent >= 100 && !launchTriggered) {
    launchTriggered = true;
    triggerLaunch();
  } else if (percent < 100 && launchTriggered) {
    launchTriggered = false;
    launchOverlay.classList.remove('active');
  }
}

function triggerLaunch() {
  launchOverlay.classList.add('active');
  spawnConfetti();
  // Brasas na fogueira do launch
  const c = document.getElementById('launchSparks'); c.innerHTML = '';
  for(let i=0;i<22;i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.cssText=`--lx:${5+Math.random()*90}%;--rd:${1+Math.random()*2}s;--dl:${-(Math.random()*2)}s;background:#ff6a00;`;
    c.appendChild(s);
  }
}

function spawnConfetti(){
  const c=document.getElementById('confettiContainer'); c.innerHTML='';
  const cols=['#ff6a00','#ffb347','#4b2d8a','#ffffff','#cc3300','#ffe0b2'];
  for(let i=0;i<120;i++){
    const el=document.createElement('div');
    el.style.cssText=`position:absolute;width:${5+Math.random()*8}px;height:${5+Math.random()*8}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'2px'};left:${Math.random()*100}%;top:-20px;animation:cFall ${2+Math.random()*3}s ease-in ${Math.random()*2}s infinite;`;
    c.appendChild(el);
  }
  if(!document.getElementById('cSt')){
    const st=document.createElement('style');st.id='cSt';
    st.textContent='@keyframes cFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.2}}';
    document.head.appendChild(st);
  }
}

socket.on('energy_update',({energy,percent})=>updateUI(percent,energy));

// Brasas normais
(function(){
  const c=document.getElementById('sparksContainer');
  for(let i=0;i<14;i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.cssText=`--lx:${10+Math.random()*80}%;--rd:${1.5+Math.random()*1.5}s;--dl:${-(Math.random()*2)}s;`;
    c.appendChild(s);
  }
})();
</script>
</body>
</html>
