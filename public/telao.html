<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 Arraiá Corporativo — Telão</title>

  <!-- Google Fonts: Bebas Neue (display) + Nunito (corpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    /* ===== RESET & VARIÁVEIS ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0804;
      --bg2:         #150f07;
      --amber:       #f59e0b;
      --orange:      #f97316;
      --red:         #ef4444;
      --yellow:      #fde047;
      --cream:       #fef3c7;
      --green:       #22c55e;
      --bar-empty:   #2a1a0a;
      --bar-fill:    linear-gradient(90deg, #92400e, #d97706, #f59e0b, #fde047);
      --font-display: 'Bebas Neue', cursive;
      --font-body:    'Nunito', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-body);
      color: var(--cream);
    }

    /* ===== PARTÍCULAS DE FUNDO ===== */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ===== LAYOUT PRINCIPAL ===== */
    .stage {
      position: relative; z-index: 1;
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr 320px;
      grid-template-areas:
        "header  header"
        "fire    sidebar"
        "bar     bar";
      gap: 0;
      padding: 24px 32px 20px;
    }

    /* ===== HEADER ===== */
    .header {
      grid-area: header;
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(245,158,11,0.2);
      margin-bottom: 12px;
    }
    .header-logo {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3.5rem);
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 20px rgba(249,115,22,0.5));
    }
    .header-sub {
      font-size: clamp(0.75rem, 1.2vw, 1rem);
      color: rgba(254,243,199,0.5);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .header-count {
      text-align: right;
    }
    .header-count .count-num {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1;
      color: var(--yellow);
      text-shadow: 0 0 30px rgba(253,224,71,0.6);
    }
    .header-count .count-label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: rgba(254,243,199,0.4);
      text-transform: uppercase;
    }

    /* ===== ÁREA DA FOGUEIRA ===== */
    .fire-area {
      grid-area: fire;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Fogueira construída com CSS puro */
    .bonfire-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transition: transform 0.6s cubic-bezier(.34,1.56,.64,1);
      transform-origin: bottom center;
    }

    /* Lenhas */
    .logs {
      width: 160px; height: 36px;
      position: relative; z-index: 2;
    }
    .log {
      position: absolute;
      height: 18px; border-radius: 9px;
      background: linear-gradient(180deg, #92400e, #451a03);
      box-shadow: inset 0 -4px 8px rgba(0,0,0,.5);
    }
    .log-1 { width: 130px; bottom: 0; left: 15px; transform: rotate(-8deg); }
    .log-2 { width: 140px; bottom: 8px; left: 10px; transform: rotate(6deg); }
    .log-3 { width: 80px;  bottom: 14px; left: 40px; transform: rotate(-2deg); }

    /* Chamas */
    .flames {
      position: relative;
      width: 140px;
      height: 200px;
      margin-bottom: -4px;
      transition: transform 0.6s ease, filter 0.6s ease;
    }
    .flame {
      position: absolute;
      bottom: 0;
      border-radius: 50% 50% 30% 30% / 80% 80% 20% 20%;
      animation: flicker var(--dur, 2s) ease-in-out infinite alternate;
      transform-origin: bottom center;
    }
    .flame-1 {
      width: 90px; height: 160px;
      left: 25px;
      background: radial-gradient(ellipse at 50% 80%, #fde047, #f97316 50%, #ef4444 100%);
      --dur: 1.8s;
      animation-delay: 0s;
      opacity: 0.95;
    }
    .flame-2 {
      width: 60px; height: 130px;
      left: 40px;
      background: radial-gradient(ellipse at 50% 80%, #fff7ed, #fde047 40%, #f97316 100%);
      --dur: 1.4s;
      animation-delay: -0.3s;
      opacity: 0.9;
    }
    .flame-3 {
      width: 40px; height: 90px;
      left: 52px;
      background: radial-gradient(ellipse at 50% 80%, #ffffff, #fef9c3 50%, #fde047 100%);
      --dur: 1.1s;
      animation-delay: -0.6s;
      opacity: 0.85;
    }
    /* Chama extra lateral esquerda */
    .flame-4 {
      width: 50px; height: 100px;
      left: 10px;
      background: radial-gradient(ellipse at 50% 80%, #fde047, #f97316 60%, #ef4444 100%);
      --dur: 2.1s;
      animation-delay: -0.9s;
      opacity: 0.7;
    }
    /* Chama extra lateral direita */
    .flame-5 {
      width: 50px; height: 110px;
      right: 10px;
      background: radial-gradient(ellipse at 50% 80%, #fde047, #f97316 60%, #ef4444 100%);
      --dur: 1.7s;
      animation-delay: -0.2s;
      opacity: 0.7;
    }
    @keyframes flicker {
      0%   { transform: scaleX(1)    scaleY(1)    skewX(0deg);  }
      33%  { transform: scaleX(1.04) scaleY(0.97) skewX(2deg);  }
      66%  { transform: scaleX(0.96) scaleY(1.03) skewX(-2deg); }
      100% { transform: scaleX(1.02) scaleY(0.98) skewX(1deg);  }
    }

    /* Brasas / partículas ascendentes */
    .sparks {
      position: absolute;
      bottom: 30px;
      left: 50%; transform: translateX(-50%);
      width: 100px; height: 200px;
      pointer-events: none;
    }
    .spark {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--yellow);
      opacity: 0;
      animation: rise var(--rd, 2s) ease-in infinite;
      animation-delay: var(--dl, 0s);
      left: var(--lx, 50%);
    }
    @keyframes rise {
      0%   { transform: translateY(0)   scale(1);   opacity: 0.9; }
      80%  { transform: translateY(-180px) scale(0.4); opacity: 0.4; }
      100% { transform: translateY(-220px) scale(0);   opacity: 0; }
    }

    /* ===== BARRA LATERAL (STATUS + CONTAGEM) ===== */
    .sidebar {
      grid-area: sidebar;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      padding-left: 32px;
      border-left: 1px solid rgba(245,158,11,0.15);
    }

    .status-card {
      background: rgba(245,158,11,0.07);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 16px;
      padding: 20px;
    }
    .status-label {
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(254,243,199,0.4);
      margin-bottom: 8px;
    }
    .status-text {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 2.2vw, 2rem);
      line-height: 1.1;
      color: var(--amber);
      transition: color 0.5s ease;
      filter: drop-shadow(0 0 10px rgba(245,158,11,0.4));
    }

    .percent-card {
      text-align: center;
    }
    .percent-num {
      font-family: var(--font-display);
      font-size: clamp(4rem, 7vw, 6rem);
      line-height: 1;
      color: var(--yellow);
      text-shadow: 0 0 40px rgba(253,224,71,0.5);
      transition: color 0.4s ease;
    }
    .percent-sym {
      font-size: 0.4em;
      vertical-align: super;
      opacity: 0.7;
    }

    /* Decoração bandeirinhas */
    .bunting {
      font-size: 1.8rem;
      text-align: center;
      letter-spacing: 4px;
      opacity: 0.6;
    }

    /* ===== BARRA DE PROGRESSO (TERMÔMETRO) ===== */
    .bar-area {
      grid-area: bar;
      padding-top: 16px;
    }
    .bar-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .bar-title {
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(254,243,199,0.4);
    }
    .bar-track {
      width: 100%;
      height: 28px;
      background: var(--bar-empty);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(245,158,11,0.2);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--bar-fill);
      border-radius: 14px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
      position: relative;
      box-shadow: 0 0 20px rgba(245,158,11,0.4);
    }
    /* Brilho animado sobre a barra */
    .bar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25) 50%, transparent);
      animation: shimmer 2s linear infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* Marcadores de milestone */
    .bar-milestones {
      position: relative;
      height: 16px;
      margin-top: 6px;
    }
    .milestone {
      position: absolute;
      transform: translateX(-50%);
      font-size: 0.6rem;
      color: rgba(254,243,199,0.35);
      letter-spacing: 1px;
    }

    /* ===== EFEITO DE LANÇAMENTO (100%) ===== */
    .launch-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(13,8,4,0.0);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .launch-overlay.active {
      pointer-events: all;
      animation: launchPulse 1s ease-in-out infinite alternate;
    }
    @keyframes launchPulse {
      0%   { background: rgba(245,158,11,0.08); }
      100% { background: rgba(245,158,11,0.18); }
    }
    .launch-text {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 9rem);
      color: var(--yellow);
      text-align: center;
      line-height: 1;
      letter-spacing: 4px;
      text-shadow:
        0 0 40px rgba(253,224,71,0.9),
        0 0 80px rgba(249,115,22,0.6),
        0 0 120px rgba(239,68,68,0.4);
      animation: textPop 0.5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes textPop {
      0%   { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .launch-sub {
      font-size: clamp(1rem, 2vw, 1.8rem);
      color: var(--cream);
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-top: 12px;
      opacity: 0.8;
    }
    .launch-confetti {
      position: absolute; inset: 0;
      overflow: hidden; pointer-events: none;
    }

    /* ===== RESPONSIVIDADE ===== */
    @media (max-width: 900px) {
      .stage {
        grid-template-rows: auto auto 1fr auto;
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "sidebar"
          "fire"
          "bar";
        padding: 16px;
        overflow-y: auto;
        height: auto;
        min-height: 100vh;
      }
      .sidebar {
        border-left: none;
        border-top: 1px solid rgba(245,158,11,0.15);
        padding-left: 0;
        padding-top: 16px;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 12px;
      }
      .status-card { flex: 1; min-width: 200px; }
      .percent-card { flex: 0 0 auto; }
      .bunting { display: none; }
    }
  </style>
</head>
<body>

<!-- ===== CANVAS DE PARTÍCULAS ===== -->
<canvas id="bg-canvas"></canvas>

<!-- ===== OVERLAY DE LANÇAMENTO ===== -->
<div class="launch-overlay" id="launchOverlay">
  <div class="launch-confetti" id="confettiContainer"></div>
  <div class="launch-text">🚀 LANÇAMENTO<br>LIBERADO!</div>
  <div class="launch-sub">🎉 Festa Junina Corporativa 🎉</div>
</div>

<!-- ===== LAYOUT PRINCIPAL ===== -->
<div class="stage">

  <!-- HEADER -->
  <header class="header">
    <div>
      <div class="header-logo">🔥 Arraiá Corporativo</div>
      <div class="header-sub">Energia do time em tempo real</div>
    </div>
    <div class="header-count">
      <div class="count-num" id="totalClicks">0</div>
      <div class="count-label">Lenhas jogadas</div>
    </div>
  </header>

  <!-- FOGUEIRA -->
  <div class="fire-area">
    <div class="bonfire-wrap" id="bonfireWrap">
      <!-- Partículas (brasas) -->
      <div class="sparks" id="sparksContainer"></div>
      <!-- Chamas -->
      <div class="flames" id="flames">
        <div class="flame flame-4"></div>
        <div class="flame flame-5"></div>
        <div class="flame flame-1"></div>
        <div class="flame flame-2"></div>
        <div class="flame flame-3"></div>
      </div>
      <!-- Lenhas -->
      <div class="logs">
        <div class="log log-1"></div>
        <div class="log log-2"></div>
        <div class="log log-3"></div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR (Status) -->
  <aside class="sidebar">
    <div class="bunting">🎪🏮🎪🏮🎪</div>
    <div class="percent-card">
      <div class="percent-num" id="percentNum">0<span class="percent-sym">%</span></div>
    </div>
    <div class="status-card">
      <div class="status-label">Status atual</div>
      <div class="status-text" id="statusText">Preparando a fogueira...</div>
    </div>
    <div class="bunting">🎪🏮🎪🏮🎪</div>
  </aside>

  <!-- BARRA DE PROGRESSO -->
  <div class="bar-area">
    <div class="bar-header">
      <span class="bar-title">🌡️ Termômetro da Energia</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="barFill"></div>
    </div>
    <div class="bar-milestones">
      <span class="milestone" style="left:0%">0%</span>
      <span class="milestone" style="left:25%">25%</span>
      <span class="milestone" style="left:50%">50%</span>
      <span class="milestone" style="left:75%">75%</span>
      <span class="milestone" style="left:100%">100%</span>
    </div>
  </div>

</div>

<!-- Socket.IO client -->
<script src="/socket.io/socket.io.js"></script>
<script>
// ============================================================
// TELÃO — Lógica JavaScript
// ============================================================

const socket = io();

// Elementos
const barFill       = document.getElementById('barFill');
const percentNum    = document.getElementById('percentNum');
const statusText    = document.getElementById('statusText');
const totalClicks   = document.getElementById('totalClicks');
const bonfireWrap   = document.getElementById('bonfireWrap');
const flames        = document.getElementById('flames');
const launchOverlay = document.getElementById('launchOverlay');
const bgCanvas      = document.getElementById('bg-canvas');

// ===== Mapa de Status por Porcentagem =====
const STATUS_MAP = [
  { min: 0,  max: 24,  text: 'Preparando a fogueira...', color: '#f59e0b' },
  { min: 25, max: 49,  text: 'Aquecendo os motores 🔥',   color: '#f97316' },
  { min: 50, max: 74,  text: 'O mercado está esquentando!', color: '#ef4444' },
  { min: 75, max: 99,  text: 'Expectativa lá em cima! 🚀', color: '#fde047' },
  { min: 100, max: 100, text: 'LANÇAMENTO LIBERADO! 🎉',   color: '#22c55e' },
];

function getStatus(percent) {
  return STATUS_MAP.find(s => percent >= s.min && percent <= s.max) || STATUS_MAP[0];
}

// ===== Atualizar Interface =====
let lastPercent = 0;
let launchTriggered = false;

function updateUI(percent, energy) {
  // --- Barra ---
  barFill.style.width = percent + '%';

  // --- Porcentagem ---
  percentNum.innerHTML = `${percent}<span class="percent-sym">%</span>`;

  // --- Total de cliques ---
  totalClicks.textContent = energy.toLocaleString('pt-BR');

  // --- Status ---
  const s = getStatus(percent);
  statusText.textContent = s.text;
  statusText.style.color = s.color;

  // --- Fogueira: escala e brilho proporcionais ---
  const scaleVal = 0.5 + (percent / 100) * 1.5; // de 0.5x até 2x
  const glowIntensity = Math.round((percent / 100) * 60); // 0px a 60px
  const glowColor = `rgba(249, 115, 22, ${0.2 + (percent / 100) * 0.6})`;
  bonfireWrap.style.transform = `scale(${scaleVal})`;
  flames.style.filter = `drop-shadow(0 0 ${glowIntensity}px ${glowColor})`;

  // --- Velocidade de flickering cresce com energia ---
  const speed = Math.max(0.5, 1.8 - (percent / 100) * 1.2); // de 1.8s a 0.6s
  document.querySelectorAll('.flame').forEach(f => {
    f.style.animationDuration = (parseFloat(f.style.getPropertyValue('--dur') || speed) * (1 - percent/200)).toFixed(2) + 's';
  });

  // --- Brilho da barra ---
  const barGlow = `0 0 ${10 + percent/2}px rgba(245,158,11,${0.2 + percent/200})`;
  barFill.style.boxShadow = barGlow;

  // --- Lançamento (100%) ---
  if (percent >= 100 && !launchTriggered) {
    launchTriggered = true;
    triggerLaunch();
  } else if (percent < 100 && launchTriggered) {
    // Se resetou
    launchTriggered = false;
    launchOverlay.classList.remove('active');
    launchOverlay.style.opacity = '0';
  }

  lastPercent = percent;
}

// ===== Efeito de Lançamento =====
function triggerLaunch() {
  launchOverlay.style.opacity = '1';
  launchOverlay.classList.add('active');
  spawnConfetti();
}

function spawnConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#fde047','#f97316','#ef4444','#22c55e','#3b82f6','#a855f7','#ec4899'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.style.cssText = `
      position:absolute;
      width:${6 + Math.random()*8}px;
      height:${6 + Math.random()*8}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      left:${Math.random()*100}%;
      top:-20px;
      animation: confettiFall ${2 + Math.random()*3}s ease-in ${Math.random()*2}s infinite;
    `;
    container.appendChild(el);
  }
  // Inject keyframes once
  if (!document.getElementById('confettiStyle')) {
    const style = document.createElement('style');
    style.id = 'confettiStyle';
    style.textContent = `
      @keyframes confettiFall {
        0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
      }`;
    document.head.appendChild(style);
  }
}

// ===== Socket.IO =====
socket.on('connect', () => {
  console.log('[Telão] Conectado ao servidor:', socket.id);
});
socket.on('energy_update', ({ energy, percent }) => {
  updateUI(percent, energy);
});
socket.on('disconnect', () => {
  console.warn('[Telão] Conexão perdida, tentando reconectar...');
});

// ===== Canvas de Partículas de Fundo =====
(function() {
  const ctx = bgCanvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = bgCanvas.width  = window.innerWidth;
    H = bgCanvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Cria partículas
  for (let i = 0; i < 40; i++) {
    particles.push({
      x: Math.random() * 1920,
      y: Math.random() * 1080,
      r: 1 + Math.random() * 2,
      dx: (Math.random() - 0.5) * 0.3,
      dy: -0.3 - Math.random() * 0.5,
      alpha: 0.1 + Math.random() * 0.3,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(245,158,11,${p.alpha})`;
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      if (p.x < 0 || p.x > W) p.dx *= -1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ===== Gerar brasas (sparks) dinamicamente =====
(function() {
  const container = document.getElementById('sparksContainer');
  const SPARK_COUNT = 12;
  for (let i = 0; i < SPARK_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const lx = 10 + Math.random() * 80;
    const rd = 1.5 + Math.random() * 1.5;
    const dl = -(Math.random() * 2);
    s.style.cssText = `--lx:${lx}%;--rd:${rd}s;--dl:${dl}s;`;
    container.appendChild(s);
  }
})();
</script>
</body>
</html>
