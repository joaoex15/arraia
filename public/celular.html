<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🔥 Coloca Lenha na Fogueira — Stanza</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />

  <style>
    /* ===== RESET & VARIÁVEIS ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #23252f;
      --orange:   #ff6a00;
      --orange-dim: rgba(255,106,0,0.15);
      --purple:   #4b2d8a;
      --cream:    #ffffff;
      --font-d:   'Bebas Neue', cursive;
      --font-b:   'Nunito', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: var(--font-b);
      color: var(--cream);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* ===== FUNDO COM TEXTURA ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 100%, rgba(255,106,0,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== LAYOUT PRINCIPAL - OCUPA 100% ===== */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 24px;
      gap: 8px;
    }

    /* ===== TOPO COM LOGO APENAS ===== */
    .top-section {
      text-align: center;
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Logo principal (grande, sem texto) */
    .main-logo {
      width: auto;
      max-width: 85%;
      height: auto;
      max-height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      display: block;
      margin: 0 auto;
    }

    /* fallback caso não carregue imagem — texto minimalista */
    .logo-fallback {
      font-family: var(--font-d);
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      color: var(--orange);
      text-shadow: 0 0 10px rgba(255,106,0,0.5);
      letter-spacing: 2px;
      background: rgba(0,0,0,0.3);
      padding: 6px 18px;
      border-radius: 60px;
      display: inline-block;
    }

    .event-sub {
      font-size: clamp(0.6rem, 2.5vw, 0.75rem);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-top: 8px;
    }

    /* Bandeirinhas decorativas */
    .bunting {
      margin-top: 6px;
      font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      letter-spacing: 4px;
      opacity: 0.4;
    }

    /* ===== SEÇÃO CENTRAL - OCUPA ESPAÇO FLEXÍVEL ===== */
    .center-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    .mini-fire {
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1;
      text-shadow: 0 0 5px #ff6a00;
    }
    @keyframes fireAnim {
      0%   { transform: scale(1) rotate(-2deg); filter: brightness(1); }
      100% { transform: scale(1.1) rotate(2deg); filter: brightness(1.25); }
    }

    /* ===== BOTÃO PRINCIPAL - RESPONSIVO ===== */
    .btn-lenha {
      position: relative;
      width: min(280px, 72vw);
      height: min(280px, 72vw);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      outline: none;
      background: radial-gradient(circle at 40% 35%, #ffb347, #ff6a00 40%, #cc3300 65%, #7a1a00 100%);
      box-shadow:
        0 0 0 6px rgba(255,106,0,0.15),
        0 0 30px rgba(255,106,0,0.3),
        0 6px 24px rgba(0,0,0,0.5);
      transition: transform 0.1s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      animation: pulse-ring 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-ring {
      0%, 100% {
        box-shadow:
          0 0 0 6px rgba(255,106,0,0.15),
          0 0 30px rgba(255,106,0,0.3),
          0 6px 24px rgba(0,0,0,0.5);
      }
      50% {
        box-shadow:
          0 0 0 16px rgba(255,106,0,0.05),
          0 0 55px rgba(255,106,0,0.5),
          0 6px 24px rgba(0,0,0,0.5);
      }
    }

    .btn-lenha:active,
    .btn-lenha.pressed {
      transform: scale(0.88);
      animation: none;
      box-shadow:
        0 0 0 3px rgba(255,106,0,0.3),
        0 0 50px rgba(255,106,0,0.7),
        0 2px 10px rgba(0,0,0,0.8);
    }

    .btn-lenha.blocked {
      transform: scale(0.92);
      opacity: 0.8;
    }

    .btn-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 4px;
      pointer-events: none;
    }

    .btn-icon {
      font-size: clamp(2.5rem, 10vw, 4rem);
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      animation: iconBounce 1.5s ease-in-out infinite alternate;
    }
    @keyframes iconBounce {
      0%   { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-5px) scale(1.04); }
    }

    .btn-text {
      font-family: var(--font-d);
      font-size: clamp(0.9rem, 4vw, 1.3rem);
      color: rgba(255,255,255,0.95);
      letter-spacing: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      background: rgba(0,0,0,0.25);
      padding: 3px 10px;
      border-radius: 60px;
    }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0);
      pointer-events: none;
      animation: rippleAnim 0.5s ease-out forwards;
    }
    @keyframes rippleAnim {
      to { transform: scale(3); opacity: 0; }
    }

    /* ===== CONTADOR LOCAL ===== */
    .counter-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .counter-num {
      font-family: var(--font-d);
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      color: var(--orange);
      text-shadow: 0 0 16px rgba(255,106,0,0.5);
      transition: transform 0.12s ease;
    }
    .counter-num.bump {
      transform: scale(1.2);
    }
    .counter-label {
      font-size: clamp(0.55rem, 2.2vw, 0.7rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    /* ===== RODAPÉ - BARRA DE ENERGIA ===== */
    .bottom-section {
      width: 100%;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .global-bar-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .gbl-title {
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      font-weight: 600;
    }
    .gbl-percent {
      font-family: var(--font-d);
      font-size: 0.85rem;
      color: var(--orange);
    }
    .global-bar-track {
      width: 100%;
      height: 8px;
      background: rgba(255,106,0,0.12);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,106,0,0.2);
    }
    .global-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #cc3300, #ff6a00, #ffb347);
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 6px rgba(255,106,0,0.5);
    }
    .global-status {
      text-align: center;
      margin-top: 6px;
      font-size: clamp(0.65rem, 2.8vw, 0.75rem);
      color: rgba(255,255,255,0.45);
      font-style: italic;
      font-weight: 500;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,106,0,0.5);
      color: #fff2e0;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 1px;
      transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2), opacity 0.2s;
      opacity: 0;
      z-index: 100;
      white-space: nowrap;
      pointer-events: none;
      font-family: var(--font-b);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Conexão */
    .conn-dot {
      position: fixed;
      top: 14px;
      right: 16px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
      transition: all 0.2s ease;
      z-index: 20;
      box-shadow: 0 0 2px rgba(0,0,0,0.3);
    }
    .conn-dot.connected    { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .conn-dot.disconnected { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

    /* Ajuste para celular: logo responsivo */
    @media (max-width: 480px) {
      .main-logo {
        max-height: 90px;
      }
    }
  </style>
</head>
<body>

<div class="conn-dot" id="connDot"></div>
<div class="toast" id="toast">🔥 Lenha adicionada!</div>

<div class="page">

  <!-- TOPO APENAS COM LOGO (sem título textual) -->
  <div class="top-section">
    <!-- Logo principal: tenta carregar logo.png; se falhar, mostra um placeholder bonito apenas com ícone 🔥 Stanza -->
    <img class="main-logo" id="customLogo" src="logo.png" alt="Stanza Logo" 
         onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
    <div class="logo-fallback" style="display: none;">⚡ STANZA 🔥</div>

  </div>

  <!-- CENTRO: Botão + Contador -->
  <div class="center-section">

    <button class="btn-lenha" id="btnLenha" aria-label="Colocar lenha na fogueira">
      <div class="btn-inner">
        <span class="btn-icon">🔥</span>
        <span class="btn-text">COLOCAR MAIS LENHA!</span>
      </div>
    </button>

    <div class="counter-wrap">
      <div class="counter-num" id="localCount">0</div>
      <div class="counter-label">Suas lenhas 🪵</div>
    </div>
  </div>

  <!-- RODAPÉ: Energia global -->
  <div class="bottom-section">
    <div class="global-bar-label">
      <span class="gbl-title">⚡ Energia do time</span>
      <span class="gbl-percent" id="globalPercent">0%</span>
    </div>
    <div class="global-bar-track">
      <div class="global-bar-fill" id="globalBarFill"></div>
    </div>
    <div class="global-status" id="globalStatus">Preparando a fogueira...</div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ============================================================
// CELULAR — Lógica JavaScript (versão final com LOGO FOCAL)
// ============================================================

const socket    = io();
const btn       = document.getElementById('btnLenha');
const connDot   = document.getElementById('connDot');
const toast     = document.getElementById('toast');
const localCnt  = document.getElementById('localCount');
const gPercent  = document.getElementById('globalPercent');
const gBarFill  = document.getElementById('globalBarFill');
const gStatus   = document.getElementById('globalStatus');

let localCount    = 0;
let canClick      = true;
const DEBOUNCE_MS = 200;
let toastTimeout  = null;

// Mapeamento de status com base na porcentagem
const STATUS_MAP = [
  { min: 0,  max: 24,  text: 'Preparando a fogueira...' },
  { min: 25, max: 49,  text: 'Aquecendo os motores 🔥' },
  { min: 50, max: 74,  text: 'O mercado está esquentando!' },
  { min: 75, max: 99,  text: 'Expectativa lá em cima! 🚀' },
  { min: 100, max: 100, text: 'LANÇAMENTOS LIBERADOS! 🎉' },
];

function getStatus(p) {
  return STATUS_MAP.find(s => p >= s.min && p <= s.max)?.text || STATUS_MAP[0].text;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 1300);
}

// Efeito ripple no botão
function spawnRipple(e) {
  const rect = btn.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  const cx = clientX - rect.left;
  const cy = clientY - rect.top;
  const size = Math.max(rect.width, rect.height) * 0.55;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.cssText = `width:${size}px;height:${size}px;left:${cx - size/2}px;top:${cy - size/2}px;`;
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

// Animação de bump no contador
function bumpCounter() {
  localCnt.classList.remove('bump');
  void localCnt.offsetWidth;
  localCnt.classList.add('bump');
  setTimeout(() => localCnt.classList.remove('bump'), 200);
}

// Manipulador de clique/toque
function handleClick(e) {
  if (e && e.preventDefault) {
    e.preventDefault();
  }
  if (!canClick) {
    btn.classList.add('blocked');
    setTimeout(() => btn.classList.remove('blocked'), 100);
    return;
  }

  canClick = false;
  setTimeout(() => { canClick = true; }, DEBOUNCE_MS);

  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 120);

  spawnRipple(e);

  localCount++;
  localCnt.textContent = localCount;
  bumpCounter();

  // Envia energia pro servidor via socket.io
  socket.emit('add_energy');

  // Mensagens dinâmicas
  const toasts = ['🔥 Lenha jogada!', '🪵 Fogueira crescendo!', '🔥 Tá pegando fogo!', '🚀 Isso aí!'];
  if (localCount % 5 === 0) {
    showToast(`🎉 ${localCount} lenhas! Você tá arrasando!`);
  } else {
    showToast(toasts[Math.floor(Math.random() * toasts.length)]);
  }
}

// Eventos do botão (clique e toque)
btn.addEventListener('click', handleClick);
btn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleClick(e);
}, { passive: false });
btn.addEventListener('contextmenu', e => e.preventDefault());

// Atualiza a barra de progresso global e o status com base nos dados do servidor
socket.on('connect', () => {
  connDot.className = 'conn-dot connected';
  console.log('[Conectado] Stanza - Arraiá');
});

socket.on('energy_update', ({ energy, percent }) => {
  gPercent.textContent = percent + '%';
  gBarFill.style.width = percent + '%';
  gStatus.textContent = getStatus(percent);

  if (percent >= 100) {
    gStatus.style.color = '#22c55e';
  } else if (percent >= 75) {
    gStatus.style.color = '#ffb347';
  } else if (percent >= 50) {
    gStatus.style.color = '#ff6a00';
  } else {
    gStatus.style.color = 'rgba(255,255,255,0.5)';
  }
});

socket.on('disconnect', () => {
  connDot.className = 'conn-dot disconnected';
  console.warn('[Desconectado] Tentando reconectar...');
});

// Tratamento de erro de logo: se a imagem falhar, mostramos fallback estilizado mas sem bagunçar layout
window.addEventListener('DOMContentLoaded', () => {
  const logoImg = document.getElementById('customLogo');
  const fallbackSpan = document.querySelector('.logo-fallback');
  
  // Se a imagem não carregar (onerror já configurado no elemento), mostramos fallback e escondemos img
  if (logoImg.complete && (logoImg.naturalWidth === 0 || logoImg.naturalHeight === 0)) {
    logoImg.style.display = 'none';
    if (fallbackSpan) fallbackSpan.style.display = 'inline-block';
  }
  
  // Caso ocorra erro após carregamento dinâmico
  logoImg.addEventListener('error', () => {
    logoImg.style.display = 'none';
    if (fallbackSpan) fallbackSpan.style.display = 'inline-block';
  });
});

// Pequeno ajuste: evitar que o botão seja arrastado ou selecionado
document.querySelectorAll('.btn-lenha, .main-logo').forEach(el => {
  el.addEventListener('dragstart', (e) => e.preventDefault());
});
</script>
</body>
</html>
